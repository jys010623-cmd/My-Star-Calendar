<style>
  /* 앱 style.css는 PC에서 body 스크롤을 잠그므로 단독 페이지에선 해제 */
  html, body { overflow: visible !important; height: auto !important; }

  .fb-wrap { max-width: 720px; margin: 0 auto; padding: 0 18px 80px; }
  .fb-top { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 14px; }
  .fb-left { display: flex; align-items: center; gap: 12px; }
  .fb-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .fb-brand .logo-svg { width: 30px; height: 30px; }
  .fb-brand b { font-size: 14.5px; font-weight: 800; letter-spacing: .01em; }
  .fb-brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 11px;
    background: var(--card); border: 1px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text); font-size: 18px;
  }
  /* 다크모드 토글 아이콘: 라이트=달, 다크=노란 해 (앱 메인과 동일) */
  #darkBtn svg { width: 20px; height: 20px; }
  #darkBtn .ico-sun { display: none; }
  [data-dark="true"] #darkBtn .ico-moon { display: none; }
  [data-dark="true"] #darkBtn .ico-sun { display: inline; }
  [data-dark="true"] #darkBtn { color: #ffd34d; }
  .fb-hero { padding: 8px 0 18px; }
  .fb-eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; color: var(--accent-deep); text-transform: uppercase; margin-bottom: 10px; }
  .fb-hero h1 { font-size: 26px; font-weight: 800; line-height: 1.28; letter-spacing: -0.02em; }
  .fb-hero p { margin-top: 10px; font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* 공지 카드는 메인과 동일한 .notice-* 스타일(style.css)을 그대로 사용 */
  .np-filter { margin: 0 0 16px; }
  .np-list { display: flex; flex-direction: column; gap: 12px; }
  .np-list .notice-body { display: block; }
  .notice-pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 20px 0 4px; }
  .notice-pager .np-btn { padding: 7px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; }
  .notice-pager .np-btn:disabled { opacity: .4; cursor: not-allowed; }
  .notice-pager .np-now { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .fb-foot { text-align: center; margin-top: 22px; font-size: 12px; color: var(--muted); }
  .fb-foot a { color: var(--accent-deep); text-decoration: none; }
</style>

<meta name="twitter:title" content="공지사항 — 마이 스타 캘린더">
<meta name="twitter:description" content="마이 스타 캘린더 공지사항 — 업데이트 소식과 안내를 한곳에서 모아 보세요.">

<body>
<div class="fb-wrap">

  <div class="fb-top">
   <div class="fb-left">
    <button class="fb-back" id="backBtn" aria-label="뒤로 가기" title="뒤로 가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <a class="fb-brand" href="index.html" aria-label="홈으로">
      <svg class="logo-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32 6 C34.5 23 41 29.5 58 32 C41 34.5 34.5 41 32 58 C29.5 41 23 34.5 6 32 C23 29.5 29.5 23 32 6 Z" fill="var(--accent)"/>
        <circle cx="50" cy="14" r="2.6" fill="var(--accent)"/>
        <circle cx="14" cy="50" r="2.6" fill="var(--accent)"/>
      </svg>
      <span><b>공지사항</b><small>MY STAR CALENDAR · NOTICE</small></span>
    </a>
   </div>
    <button class="icon-btn" id="darkBtn" aria-label="다크 모드 전환" title="다크 모드"><svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 1 1 10 3.5a7 7 0 0 0 10.5 10.5Z"/></svg><svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.4 4.4l1.85 1.85M17.75 17.75l1.85 1.85M2.5 12h2.6M18.9 12h2.6M4.4 19.6l1.85-1.85M17.75 6.25l1.85-1.85"/></svg></button>
  </div>

  <div class="fb-hero">
    <p class="fb-eyebrow">Notice</p>
    <h1>공지사항</h1>
    <p>업데이트 소식과 안내를 모아뒀어요. 최신 소식이 맨 위에 있고, 자잘한 수정 내역은 '패치' 탭에서 볼 수 있어요.</p>
  </div>

  <div class="filter-row np-filter" id="noticeFilter"></div>
  <div class="np-list" id="noticeList"></div>

  <p class="fb-foot">© <span id="yr"></span> 마이 스타 캘린더 · <a href="index.html">mystarzip.com</a><br><span class="fb-links" style="display:inline-block;margin-top:7px"><a href="privacy.html">개인정보처리방침</a> · <a href="terms.html">이용약관</a></span></p>
</div>

<script src="script/notices-data.js?v=51"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };

  function syncTheme() {
    try {
      var raw = localStorage.getItem("myStarCalendar.v1");
      var S = raw ? JSON.parse(raw) : null;
      var root = document.documentElement;
      var dark = readDark(S);
      var acc = (S && S.accent) ? S.accent : "#141414";
      if (acc.toLowerCase() === "#141414" && dark) acc = "#f2f2ef";
      root.style.setProperty("--accent", acc);
      var r = parseInt(acc.slice(1,3),16), g = parseInt(acc.slice(3,5),16), b = parseInt(acc.slice(5,7),16);
      var lum = 0.299*r + 0.587*g + 0.114*b;
      root.style.setProperty("--on-accent", lum > 150 ? "#111111" : "#ffffff");
      root.setAttribute("data-dark", dark ? "true" : "false");
      var mt = document.getElementById("metaTheme");
      if (mt) mt.setAttribute("content", dark ? "#131314" : "#ffffff");
    } catch (e) {}
  }
  function readDark(S) {
    var saved = localStorage.getItem("fb.dark");
    if (saved !== null) return saved === "1";
    if (S && typeof S.dark === "boolean") return S.dark;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  syncTheme();

  $("#darkBtn").addEventListener("click", function () {
    var now = document.documentElement.getAttribute("data-dark") === "true";
    localStorage.setItem("fb.dark", now ? "0" : "1");
    syncTheme();
  });

  $("#backBtn").addEventListener("click", function () {
    var fromPage = "";
    try { fromPage = localStorage.getItem("msc_back_page") || ""; } catch (e) {}
    if (fromPage && fromPage !== "home") { window.location.href = "index.html#" + fromPage; return; }
    if (history.length > 1 && document.referrer) history.back();
    else window.location.href = "index.html";
  });

  document.getElementById("yr").textContent = new Date().getFullYear();

  /* 공지 목록 렌더 (notices-data.js의 window.NOTICES 사용) */
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var CATS = window.NOTICE_CATS || {};
  function noticeDateKey(n) { var m = String(n.date).match(/\d{4}\.\d{2}\.\d{2}/); return m ? m[0] : ""; }
  var NOTICES = (window.NOTICES || []).slice().sort(function (a, b) { return noticeDateKey(b).localeCompare(noticeDateKey(a)) || (b.id - a.id); });
  var wrap = document.getElementById("noticeList");
  var filterWrap = document.getElementById("noticeFilter");

  function catGroup(cat) { return (cat === "update" || cat === "info" || cat === "patch") ? cat : "etc"; }

  var PAGE_SIZE = 10;       // 한 페이지에 보여줄 공지 개수
  var curFilter = "all";
  function itemHtml(n) {
    var c = CATS[n.cat] || CATS.info || { label: "안내", color: "--c-broadcast" };
    return '<div class="notice-item">'
      + '<div class="notice-top">'
      + '<span class="notice-cat" style="background:var(' + c.color + ')">' + esc(c.label) + '</span>'
      + '<span class="notice-date">' + esc(n.date) + '</span>'
      + '</div>'
      + '<h4 class="notice-title">' + esc(n.title) + '</h4>'
      + '<p class="notice-body">' + esc(n.body) + '</p>'
      + '</div>';
  }
  function renderList(filter, page) {
    curFilter = filter;
    var items = NOTICES.filter(function (n) {
      // '전체'에선 패치를 숨기고, '패치' 버튼을 눌렀을 때만 패치를 보여줘요
      return filter === "all" ? n.cat !== "patch" : catGroup(n.cat) === filter;
    });
    if (!items.length) {
      wrap.innerHTML = '<p class="notice-empty">해당 분류의 공지가 없어요.</p>';
      return;
    }
    var pages = Math.ceil(items.length / PAGE_SIZE);
    page = Math.min(Math.max(1, page || 1), pages);
    var start = (page - 1) * PAGE_SIZE;
    var html = items.slice(start, start + PAGE_SIZE).map(itemHtml).join("");
    if (pages > 1) {
      html += '<div class="notice-pager">'
        + '<button class="np-btn" data-pg="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>← 이전</button>'
        + '<span class="np-now">' + page + ' / ' + pages + '</span>'
        + '<button class="np-btn" data-pg="' + (page + 1) + '"' + (page >= pages ? ' disabled' : '') + '>다음 →</button>'
        + '</div>';
    }
    wrap.innerHTML = html;
    wrap.querySelectorAll(".np-btn").forEach(function (b) {
      b.addEventListener("click", function () {
        renderList(curFilter, +b.getAttribute("data-pg"));
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  if (!NOTICES.length) {
    wrap.innerHTML = '<p class="notice-empty">아직 공지가 없어요.</p>';
    filterWrap.style.display = "none";
  } else {
    var chips = [{ k: "all", label: "전체" }];
    if (NOTICES.some(function (n) { return n.cat === "update"; })) chips.push({ k: "update", label: "업데이트" });
    if (NOTICES.some(function (n) { return n.cat === "info"; }))   chips.push({ k: "info", label: "안내" });
    if (NOTICES.some(function (n) { return n.cat === "patch"; }))  chips.push({ k: "patch", label: "패치" });
    if (NOTICES.some(function (n) { return catGroup(n.cat) === "etc"; })) chips.push({ k: "etc", label: "그 외" });

    filterWrap.innerHTML = chips.map(function (ch, i) {
      return '<button class="f-chip' + (i === 0 ? " active" : "") + '" data-f="' + ch.k + '">' + esc(ch.label) + '</button>';
    }).join("");

    filterWrap.addEventListener("click", function (e) {
      var btn = e.target.closest(".f-chip");
      if (!btn) return;
      filterWrap.querySelectorAll(".f-chip").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      renderList(btn.getAttribute("data-f"), 1);
    });

    renderList("all", 1);
  }
})();
</script>
</body>
</html>
